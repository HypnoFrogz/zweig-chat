# Grafana: дашборды использования мессенджера по сотрудникам и времени.
#
# Подключается поверх основного файла:
#   sudo docker compose -f docker-compose.yml [другие -f ...] \
#     -f deploy/docker-compose.grafana.yml up -d
#
# Открывается по адресу https://<домен чата>/grafana/ (nginx проксирует,
# отдельный порт наружу не нужен). Вход — логин и пароль из .env:
#   GRAFANA_ADMIN_PASSWORD=...   (обязательно)
#   GRAFANA_ROOT_URL=https://chat.example.ru/grafana/
# Подробно — docs/grafana.md.
services:
  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: zweig-grafana
    restart: unless-stopped
    # root: база мессенджера в режиме WAL, и даже читателю SQLite нужно
    # писать служебный файл -shm рядом с ней. Саму базу Grafana открывает
    # только на чтение (mode=ro в источнике данных).
    user: "0"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Задайте GRAFANA_ADMIN_PASSWORD в .env}
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-https://chat.example.com/grafana/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_INSTALL_PLUGINS=frser-sqlite-datasource
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/zweig-usage.json
    volumes:
      - data:/var/lib/zweig
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - app-net

volumes:
  grafana-data:
