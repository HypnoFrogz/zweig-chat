services:
  backend:
    build: ./backend
    container_name: zweig-backend
    restart: unless-stopped
    volumes:
      - uploads:/app/uploads
      - data:/app/data
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    environment:
      # Secrets are injected from .env (see .env.example). Never hardcode them here.
      - SECRET_KEY=${SECRET_KEY}
      - FIREBASE_CREDENTIALS=/app/firebase-service-account.json
      - UPLOAD_DIR=/app/uploads
      - DATA_DIR=/app/data
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_PUBLIC_URL=wss://chat.example.com/livekit/
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_EMAIL=${VAPID_EMAIL}
      - SERVER_DOMAIN=${SERVER_DOMAIN}
      - FEDERATION_ALLOW_HTTP=${FEDERATION_ALLOW_HTTP}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - app-net

  nginx:
    image: nginx:alpine
    container_name: zweig-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - uploads:/uploads:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      livekit:
        condition: service_started
    networks:
      - app-net

  livekit:
    image: livekit/livekit-server:latest
    container_name: zweig-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882-7892:7882-7892/udp"
      - "3478:3478/udp"
      - "5349:5349"
      # TURN relay range — must match turn.relay_range_* in livekit.yaml.
      # Without it TURN hands clients relay addresses on ports that never
      # reach the container, ICE finds no working candidate pair and the
      # browser reports "your TURN server appears to be broken".
      - "30000-30100:30000-30100/udp"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    command: ["--config", "/etc/livekit.yaml"]
    networks:
      - app-net

  certbot:
    image: certbot/certbot
    container_name: zweig-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - app-net

volumes:
  data:
  uploads:

networks:
  app-net:
    driver: bridge
