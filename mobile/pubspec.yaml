name: nebenan
description: Nebenan Messenger — mobile app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.4.0
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0
  web_socket_channel: ^2.4.0
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  file_picker: ^10.0.0
  path_provider: ^2.1.2
  permission_handler: ^11.2.0
  share_plus: ^7.2.1
  intl: ^0.19.0
  cupertino_icons: ^1.0.6
  url_launcher: ^6.2.4
  livekit_client: ^2.3.3
  flutter_pdfview: ^1.3.2
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^18.0.0
  audioplayers: ^6.1.0
  app_badge_plus: ^1.1.4
  flutter_callkit_incoming: 3.0.0
  uuid: ^4.4.0
  shared_preferences: ^2.5.3
  open_filex: ^4.3.4
  wakelock_plus: ^1.2.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/sounds/
