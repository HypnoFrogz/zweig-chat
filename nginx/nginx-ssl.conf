worker_processes auto;

events {
    worker_connections 1024;
}

# ─────────────────────────────────────────────────────────────────────────────
# PRODUCTION CONFIG — HTTPS. MESSENGER ONLY.
#
#   your messenger domain  → web client + API + WebSocket + uploads + LiveKit
#
# Applied by ./init-ssl.sh once the certificate exists.
#
# Set server_name and the ssl_certificate paths below to your own domain / cert
# directory. Extra server blocks can be added under /etc/nginx/extra/ (see the
# include at the bottom).
# ─────────────────────────────────────────────────────────────────────────────
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 500M;

    # HTTP — ACME challenge (any host) + redirect everything else to HTTPS
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Messenger: web client + backend ──────────────────────────────────────
    server {
        listen 443 ssl default_server;
        server_name chat.example.com;

        ssl_certificate /etc/letsencrypt/live/chat.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        root /usr/share/nginx/html;
        index index.html;

        # Resolve upstreams at request time via Docker's embedded DNS, so a
        # restarting backend/livekit never crashes nginx on config load.
        resolver 127.0.0.11 valid=30s ipv6=off;

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        location = /service-worker.js {
            add_header Service-Worker-Allowed /;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # WebSocket (messaging)
        location /api/ws/ {
            set $backend http://backend:8000;
            proxy_pass $backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # LiveKit signaling
        location /livekit/ {
            set $livekit http://livekit:7880;
            rewrite ^/livekit/(.*) /$1 break;
            proxy_pass $livekit;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
        }

        # REST API
        location /api/ {
            set $backend http://backend:8000;
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /uploads/ {
            alias /uploads/;
            autoindex off;
        }
    }

    # Optional extra server blocks (none by default).
    include /etc/nginx/extra/*.conf;
}
