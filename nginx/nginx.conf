worker_processes auto;

events {
    worker_connections 1024;
}

# ─────────────────────────────────────────────────────────────────────────────
# BOOTSTRAP CONFIG — plain HTTP, no TLS. MESSENGER ONLY.
#
# What nginx starts with on a fresh deploy, BEFORE any Let's Encrypt certificate
# exists: serves the web client over HTTP and answers the ACME challenge (for
# any host) so certbot can issue the certificate.
#
# Extra server blocks can be dropped into /etc/nginx/extra/ (picked up by the
# include at the bottom of the http block); none are shipped by default.
#
# ./init-ssl.sh then replaces this file with nginx-ssl.conf (HTTPS, terminated
# here). Deployments that terminate TLS in a separate nginx in front of this
# container keep using this file — hence the /livekit/ block below.
#
# Backend proxying uses Docker's embedded DNS (127.0.0.11) via a variable, so
# nginx resolves `backend` at request time instead of at startup (a plain
# proxy_pass would crash-loop nginx if the name isn't resolvable at config load).
# ─────────────────────────────────────────────────────────────────────────────
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 500M;

    # Messenger web client + ACME for any host (bootstrap phase).
    server {
        listen 80 default_server;
        server_name _;

        resolver 127.0.0.11 valid=30s ipv6=off;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        root /usr/share/nginx/html;
        index index.html;

        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
        location = /service-worker.js {
            add_header Service-Worker-Allowed /;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ws/ {
            set $backend http://backend:8000;
            proxy_pass $backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # LiveKit signalling. Also needed here — not only in nginx-ssl.conf —
        # when TLS is terminated by a separate nginx in front of this container:
        # that setup keeps this file active, and without this block /livekit/…
        # falls through to the SPA `try_files` above and answers the WebSocket
        # handshake with index.html, so the client fails with close code 1006.
        location /livekit/ {
            set $livekit http://livekit:7880;
            rewrite ^/livekit/(.*) /$1 break;
            proxy_pass $livekit;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /api/ {
            set $backend http://backend:8000;
            proxy_pass $backend$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        location /uploads/ {
            alias /uploads/;
            autoindex off;
        }
    }

    # Optional extra server blocks (none by default).
    include /etc/nginx/extra/*.conf;
}
